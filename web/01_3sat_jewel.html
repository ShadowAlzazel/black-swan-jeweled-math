  <h3>A 3SAT jewel in the complex plane</h3>
  <div class="viz-controls">
    <label class="form-label" for="sat-clause-count">Active clauses: <output id="sat-clause-value" class="tabular-nums">3 / 8</output>
      <input class="form-range" id="sat-clause-count" type="range" min="0" max="8" step="1" value="3">
    </label>
    <label class="form-label" for="sat-assignment">Assignment (a, b, c)
      <select class="form-select" id="sat-assignment">
        <option value="0">000</option><option value="1">001</option>
        <option value="2">010</option><option value="3">011</option>
        <option value="4">100</option><option value="5">101</option>
        <option value="6">110</option><option value="7">111</option>
      </select>
    </label>
  </div>
  <label class="form-check">
    <input class="form-check-input" id="sat-show-walk" type="checkbox">
    <span class="form-check-label">Show a Hamiltonian walk through all assignments</span>
  </label>
  <div id="sat-summary" class="sat-summary tabular-nums" role="status" aria-live="polite"></div>
  <div class="sat-plot" id="sat-plot"></div>
  <div class="sat-legend text-small" aria-label="Legend">
    <span><i class="sat-swatch sat-swatch-solution" aria-hidden="true"></i>Circle: satisfies all clauses</span>
    <span><i class="sat-swatch sat-swatch-failed" aria-hidden="true"></i>Square: violates a clause</span>
    <span id="sat-walk-legend" hidden><i class="sat-swatch sat-swatch-walk" aria-hidden="true"></i>Hamiltonian walk</span>
  </div>
  <div id="sat-selection" class="sat-selection text-small tabular-nums" aria-live="polite"></div>
  <script>
    (() => {
      const root = document.getElementById('black-swan-sat-jewel');
      const slider = root.querySelector('#sat-clause-count');
      const assignment = root.querySelector('#sat-assignment');
      const walk = root.querySelector('#sat-show-walk');
      const plot = root.querySelector('#sat-plot');
      const summary = root.querySelector('#sat-summary');
      const detail = root.querySelector('#sat-selection');
      const countLabel = root.querySelector('#sat-clause-value');
      const walkLegend = root.querySelector('#sat-walk-legend');
      const ns = 'http://www.w3.org/2000/svg';
      const forbiddenOrder = [0, 4, 2, 1, 3, 5, 6, 7];
      const grayWalk = [0, 1, 3, 2, 6, 7, 5, 4];
      const vertices = Array.from({length: 8}, (_, id) => {
        const a = (id >> 2) & 1, b = (id >> 1) & 1, c = id & 1;
        return {id, a, b, c, label: id.toString(2).padStart(3, '0'), re: a + c / 2, im: b + c / 2};
      });
      const edges = [];
      vertices.forEach(v => [1, 2, 4].forEach(mask => {
        const neighbor = v.id ^ mask;
        if (v.id < neighbor) edges.push([v.id, neighbor]);
      }));
      function el(tag, attributes, parent, text) {
        const node = document.createElementNS(ns, tag);
        Object.entries(attributes || {}).forEach(([key, value]) => node.setAttribute(key, value));
        if (text !== undefined) node.textContent = text;
        parent.appendChild(node);
        return node;
      }
      function update() {
        const m = Number(slider.value), selected = Number(assignment.value);
        const excluded = new Set(forbiddenOrder.slice(0, m));
        const failedClause = forbiddenOrder.indexOf(selected) + 1;
        const solutions = vertices.filter(v => !excluded.has(v.id)).length;
        countLabel.textContent = m + ' / 8';
        summary.textContent = '8 assignments · ' + solutions + ' satisfying · ' + (solutions ? 'SAT' : 'UNSAT');
        detail.textContent = vertices[selected].label + ' · ' + (excluded.has(selected)
          ? '1 violated clause (C' + failedClause + ')'
          : '0 violated clauses');
        walkLegend.hidden = !walk.checked;
        const width = Math.max(280, plot.getBoundingClientRect().width);
        const height = Math.min(380, Math.max(300, width * 0.62));
        const frame = {left: 64, right: width - 12, top: 12, bottom: height - 48};
        const xr = [frame.left + 30, frame.right - 30];
        const yr = [frame.bottom - 30, frame.top + 30];
        const realExtent = [Math.min(...vertices.map(v => v.re)), Math.max(...vertices.map(v => v.re))];
        const imagExtent = [Math.min(...vertices.map(v => v.im)), Math.max(...vertices.map(v => v.im))];
        const x = value => xr[0] + (value - realExtent[0]) / (realExtent[1] - realExtent[0]) * (xr[1] - xr[0]);
        const y = value => yr[0] + (value - imagExtent[0]) / (imagExtent[1] - imagExtent[0]) * (yr[1] - yr[0]);
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
        svg.setAttribute('height', height);
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-labelledby', 'sat-jewel-title sat-jewel-desc');
        el('title', {id: 'sat-jewel-title'}, svg, 'Eight Boolean assignments projected into the complex plane');
        el('desc', {id: 'sat-jewel-desc'}, svg, 'Each edge flips one bit. Circles satisfy every active clause; squares fail a clause. ' + solutions + ' assignments satisfy the formula. The optional walk visits all eight assignments, including rejected ones. Use the assignment selector for keyboard selection.');
        el('rect', {x: frame.left, y: frame.top, width: frame.right - frame.left, height: frame.bottom - frame.top, fill: 'none', stroke: 'var(--border)', 'data-chart-frame': ''}, svg);
        [0, 0.5, 1, 1.5].forEach(tick => {
          el('line', {x1: x(tick), x2: x(tick), y1: frame.bottom, y2: frame.bottom + 5, stroke: 'var(--border)'}, svg);
          el('text', {x: x(tick), y: frame.bottom + 19, 'text-anchor': 'middle'}, svg, tick.toString());
          el('line', {x1: frame.left - 5, x2: frame.left, y1: y(tick), y2: y(tick), stroke: 'var(--border)'}, svg);
          el('text', {x: frame.left - 10, y: y(tick) + 4, 'text-anchor': 'end'}, svg, tick.toString());
        });
        el('text', {x: (frame.left + frame.right) / 2, y: height - 6, 'text-anchor': 'middle', class: 'axis-title', 'data-axis': 'x'}, svg, 'Re(w)');
        const midY = (frame.top + frame.bottom) / 2;
        el('text', {x: 17, y: midY, 'text-anchor': 'middle', transform: 'rotate(-90 17 ' + midY + ')', class: 'axis-title', 'data-axis': 'y'}, svg, 'Im(w)');
        edges.forEach(([u, v]) => el('line', {
          x1: x(vertices[u].re), y1: y(vertices[u].im), x2: x(vertices[v].re), y2: y(vertices[v].im),
          stroke: 'var(--border)', 'stroke-width': 1.5
        }, svg));
        if (walk.checked) {
          const points = grayWalk.map(id => x(vertices[id].re) + ',' + y(vertices[id].im)).join(' ');
          el('polyline', {points, fill: 'none', stroke: 'var(--viz-series-3)', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'data-walk': ''}, svg);
        }
        vertices.forEach(v => {
          const px = x(v.re), py = y(v.im), rejected = excluded.has(v.id);
          const group = el('g', {'data-assignment': v.id, class: 'cursor-interaction'}, svg);
          const fill = rejected
            ? 'color-mix(in srgb, var(--viz-series-2) 17%, var(--background))'
            : 'color-mix(in srgb, var(--viz-series-1) 20%, var(--background))';
          if (rejected) {
            el('rect', {x: px - 22, y: py - 22, width: 44, height: 44, fill, stroke: 'var(--border)', 'data-state': 'rejected'}, group);
          } else {
            el('circle', {cx: px, cy: py, r: 23, fill, stroke: 'var(--border)', 'data-state': 'satisfying'}, group);
          }
          if (v.id === selected) el('circle', {cx: px, cy: py, r: 28, fill: 'none', stroke: 'var(--foreground)', 'stroke-width': 1.5, 'data-selected': ''}, group);
          el('text', {x: px, y: py + 4, 'text-anchor': 'middle', 'pointer-events': 'none'}, group, v.label);
          el('rect', {x: px - 23, y: py - 23, width: 46, height: 46, fill: 'transparent', 'data-chart-hit': '', 'aria-label': v.label + ': ' + (rejected ? '1 violated clause' : 'satisfies all clauses')}, group);
          group.addEventListener('click', () => { assignment.value = v.id; update(); });
        });
        plot.replaceChildren(svg);
      }
      slider.addEventListener('input', update);
      assignment.addEventListener('change', update);
      walk.addEventListener('change', update);
      new ResizeObserver(update).observe(plot);
      update();
    })();
  </script>
</div>
</main><script>
(() => {
  const tip = document.createElement('div');
  tip.className = 'export-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  let active = null;
  function show(target, x, y) {
    const mark = target instanceof Element ? target.closest('[data-tooltip]') : null;
    if (!mark) { tip.hidden = true; active = null; return; }
    active = mark; tip.textContent = mark.getAttribute('data-tooltip'); tip.hidden = false;
    const bounds = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 12, window.innerWidth - bounds.width - 8)) + 'px';
    tip.style.top = Math.max(8, Math.min(y + 12, window.innerHeight - bounds.height - 8)) + 'px';
  }
  document.addEventListener('pointermove', event => show(event.target, event.clientX, event.clientY));
  document.addEventListener('pointerdown', event => {
    const mark = event.target instanceof Element ? event.target.closest('[data-tooltip]') : null;
    if (active === mark && !tip.hidden) { tip.hidden = true; active = null; }
    else show(event.target, event.clientX, event.clientY);
  });
  document.addEventListener('focusin', event => { const b = event.target.getBoundingClientRect(); show(event.target, b.left, b.bottom); });
  document.addEventListener('focusout', () => { tip.hidden = true; active = null; });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { tip.hidden = true; active = null; } });
})();
</script></body>
</html>
