          const byId = new Map(data.geometry.candidates.map(p => [p.id, p]));
          element('title', {id: 'jewel-plot-title'}, svg, 'Octagonal cut-and-project quasicrystal patch');
          element('desc', {id: 'jewel-plot-desc'}, svg, 'Integer points in four dimensions are selected by an octagonal internal window and projected into the plane. Changing the internal window shift changes which points are accepted.');
          const {x, y} = axes(svg, data.geometry.candidates, width, height);
          edges.forEach(([u, v]) => {
            const a = xy(byId.get(u)), b = xy(byId.get(v));
            element('line', {x1: x(a[0]), y1: y(a[1]), x2: x(b[0]), y2: y(b[1]), stroke: 'var(--border)', 'stroke-width': 1.25}, svg);
          });
          points.forEach(p => element('circle', {cx: x(p.physical[0]), cy: y(p.physical[1]), r: 3.2, fill: 'var(--viz-series-1)', 'data-site': '', 'data-tooltip': 'Lattice point (' + p.lattice.join(', ') + ')'}, svg));
          root.querySelector('#jewel-shift-value').textContent = dx.toFixed(2);
          live.textContent = points.length + ' sites · ' + edges.length + ' unit lattice edges';
          legend.textContent = 'Dots: accepted lattice points · Edges: one lattice-coordinate step';
          detail.textContent = '4D lattice → internal window → 2D projection';
        } else {
          const demo = data.demos[Number(example.value)];
          const run = demo.runs[method.value], path = run.path;
          const points = data.geometry.booleanVertices;
          const byId = new Map(points.map(p => [p.id, p]));
          const solutions = new Set(points.filter(p => violationCount(p.id, demo.clauses) === 0).map(p => p.id));
          const last = path[path.length - 1], remaining = violationCount(last, demo.clauses);
          element('title', {id: 'jewel-plot-title'}, svg, 'A four-variable 3SAT search projected into the complex plane');
          element('desc', {id: 'jewel-plot-desc'}, svg, 'Sixteen assignments are projected from four dimensions using the octagonal basis. Edges flip one Boolean variable. Diamonds are satisfying assignments. The highlighted path follows strict weighted greedy descent from the same starting point for every weighting.');
          const {x, y} = axes(svg, points, width, height);
          points.forEach(p => [1, 2, 4, 8].forEach(mask => {
            const next = p.id ^ mask;
            if (p.id < next) {
              const q = byId.get(next);
              element('line', {x1: x(p.physical[0]), y1: y(p.physical[1]), x2: x(q.physical[0]), y2: y(q.physical[1]), stroke: 'var(--border)', 'stroke-width': 1, opacity: 0.65}, svg);
            }
          }));
          element('polyline', {points: path.map(id => { const p = byId.get(id); return x(p.physical[0]) + ',' + y(p.physical[1]); }).join(' '), fill: 'none', stroke: 'var(--viz-series-1)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'data-search-path': ''}, svg);
          points.forEach(p => {
            const px = x(p.physical[0]), py = y(p.physical[1]);
            const solved = solutions.has(p.id);
            const group = element('g', {'data-assignment': p.id, 'data-tooltip': p.label + ' · ' + violationCount(p.id, demo.clauses) + ' violations · weighted energy ' + energy(p.id, demo.clauses, run.weights).toFixed(3)}, svg);
            if (solved) element('path', {d: 'M ' + px + ' ' + (py - 7) + ' L ' + (px + 7) + ' ' + py + ' L ' + px + ' ' + (py + 7) + ' L ' + (px - 7) + ' ' + py + ' Z', fill: 'var(--viz-series-2)', 'data-solution': ''}, group);
            else element('circle', {cx: px, cy: py, r: 4, fill: 'var(--muted-foreground)'}, group);
            if (p.id === demo.start) element('circle', {cx: px, cy: py, r: 10, fill: 'none', stroke: 'var(--foreground)', 'stroke-width': 1.5, 'data-start': ''}, group);
            if (p.id === last) element('circle', {cx: px, cy: py, r: 13, fill: 'none', stroke: 'var(--viz-series-1)', 'stroke-width': 2, 'data-end': ''}, group);
            element('text', {x: px, y: py - 17, 'text-anchor': 'middle', class: 'jewel-label'}, group, p.label);
          });
          live.textContent = (path.length - 1) + ' flips · ' + (remaining === 0 ? 'solution found' : 'local minimum') + ' · ' + remaining + ' violated clauses';
          legend.textContent = 'Diamond: solution · Thin edge: one-bit flip · Highlight: search path';
          detail.textContent = 'Start ' + byId.get(demo.start).label + ' → end ' + byId.get(last).label + ' · final weighted energy ' + energy(last, demo.clauses, run.weights).toFixed(3);
        }
        figure.replaceChildren(svg);
      }
      view.addEventListener('change', update);
      example.addEventListener('change', update);
      method.addEventListener('change', update);
      shift.addEventListener('input', update);
      new ResizeObserver(update).observe(figure);
      update();
    })();
  </script>
</div>
</main><script>
(() => {
  const tip = document.createElement('div');
  tip.className = 'export-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  let active = null;
  function show(target, x, y) {
    const mark = target instanceof Element ? target.closest('[data-tooltip]') : null;
    if (!mark) { tip.hidden = true; active = null; return; }
    active = mark; tip.textContent = mark.getAttribute('data-tooltip'); tip.hidden = false;
    const bounds = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 12, window.innerWidth - bounds.width - 8)) + 'px';
    tip.style.top = Math.max(8, Math.min(y + 12, window.innerHeight - bounds.height - 8)) + 'px';
  }
  document.addEventListener('pointermove', event => show(event.target, event.clientX, event.clientY));
  document.addEventListener('pointerdown', event => {
    const mark = event.target instanceof Element ? event.target.closest('[data-tooltip]') : null;
    if (active === mark && !tip.hidden) { tip.hidden = true; active = null; }
    else show(event.target, event.clientX, event.clientY);
  });
  document.addEventListener('focusin', event => { const b = event.target.getBoundingClientRect(); show(event.target, b.left, b.bottom); });
  document.addEventListener('focusout', () => { tip.hidden = true; active = null; });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { tip.hidden = true; active = null; } });
})();
</script></body>
