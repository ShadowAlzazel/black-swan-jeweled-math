  <script>
    (() => {
      const root = document.getElementById('hat-pinwheel-zeta-lab');
      const data = JSON.parse(root.querySelector('#pattern-data').textContent);
      if (data.pending) return;
      const view = root.querySelector('#pattern-view');
      const level = root.querySelector('#pattern-level');
      const color = root.querySelector('#pattern-color');
      const figure = root.querySelector('#pattern-figure');
      const status = root.querySelector('#pattern-status');
      const legend = root.querySelector('#pattern-legend');
      const detail = root.querySelector('#pattern-detail');
      const levelLabel = root.querySelector('#pattern-level-label');
      const levelValue = root.querySelector('#pattern-level-value');
      const ns = 'http://www.w3.org/2000/svg';
      const eventMaxWeight = Math.max(...data.events.flatMap(event => event.weights));
      function element(tag, attrs, parent, text) {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, value));
        if (text !== undefined) node.textContent = text;
        parent.appendChild(node); return node;
      }
      function legendItem(text, fill) {
        const item = document.createElement('span');
        const swatch = document.createElement('i');
        swatch.className = 'pattern-swatch'; swatch.style.background = fill;
        swatch.setAttribute('aria-hidden', 'true'); item.appendChild(swatch);
        item.appendChild(document.createTextNode(text)); legend.appendChild(item);
      }
      function gcd(a, b) { while (b) { const next = a % b; a = b; b = next; } return a; }
      function labelBits(state) { return Array.from({length: 4}, (_, j) => (state >> j) & 1).join(''); }
      function fit(polygons, width, height) {
        const vertices = polygons.flat();
        const minX = Math.min(...vertices.map(p => p[0])), maxX = Math.max(...vertices.map(p => p[0]));
        const minY = Math.min(...vertices.map(p => p[1])), maxY = Math.max(...vertices.map(p => p[1]));
        const scale = Math.min((width - 20) / (maxX - minX), (height - 20) / (maxY - minY));
        const x = v => (width - (maxX - minX) * scale) / 2 + (v - minX) * scale;
        const y = v => (height - (maxY - minY) * scale) / 2 + (v - minY) * scale;
        return {x, y};
      }
      function update() {
        const mode = view.value, index = Number(level.value);
        const width = Math.max(280, figure.getBoundingClientRect().width);
        const height = Math.min(470, Math.max(300, width * 0.67));
        root.querySelector('#pattern-color-label').hidden = mode === 'adaptive' || mode === 'lattice';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
        svg.setAttribute('height', height); svg.setAttribute('role', 'img');
        svg.setAttribute('aria-labelledby', 'pattern-svg-title pattern-svg-desc');
        legend.replaceChildren();
        if (mode === 'lattice') {
          const n = [5, 10, 20, 40][index];
          levelLabel.textContent = 'Lattice size'; levelValue.textContent = n + ' × ' + n;
          element('title', {id: 'pattern-svg-title'}, svg, 'Coprime points in a positive integer lattice');
          element('desc', {id: 'pattern-svg-desc'}, svg, 'Highlighted pairs have greatest common divisor one and are visible from the origin. Their limiting fraction is six divided by pi squared.');
          const left = 64, right = width - 16, top = 16, bottom = height - 44;
          const x = a => left + 8 + (a - 1) / (n - 1) * (right - left - 16);
          const y = b => bottom - 8 - (b - 1) / (n - 1) * (bottom - top - 16);
          element('rect', {x: left, y: top, width: right - left, height: bottom - top, fill: 'none', stroke: 'var(--border)'}, svg);
          let visible = 0;
          for (let a = 1; a <= n; a++) for (let b = 1; b <= n; b++) {
            const primitive = gcd(a, b) === 1; if (primitive) visible++;
            const radius = Math.max(1.1, Math.min(3, (right - left) / n / 4));
            element('circle', {cx: x(a), cy: y(b), r: radius, fill: primitive ? 'var(--viz-series-1)' : 'var(--muted-foreground)', opacity: primitive ? 1 : 0.22, 'data-lattice-point': '', 'data-coprime': primitive ? 'true' : 'false'}, svg);
          }
          [1, Math.round(n / 2), n].forEach(tick => {
            element('text', {x: x(tick), y: bottom + 18, 'text-anchor': 'middle'}, svg, tick);
            element('text', {x: left - 9, y: y(tick) + 4, 'text-anchor': 'end'}, svg, tick);
          });
          element('text', {x: (left + right) / 2, y: height - 4, 'text-anchor': 'middle', class: 'axis-title', 'data-axis': 'x'}, svg, 'Integer a');
          const cy = (top + bottom) / 2;
          element('text', {x: 16, y: cy, transform: 'rotate(-90 16 ' + cy + ')', 'text-anchor': 'middle', class: 'axis-title', 'data-axis': 'y'}, svg, 'Integer b');
          status.textContent = visible + ' / ' + n * n + ' coprime pairs · ' + (100 * visible / (n * n)).toFixed(2) + '%';
          legendItem('Coprime', 'var(--viz-series-1)'); legendItem('Share a common divisor', 'var(--muted-foreground)');
          detail.textContent = 'Limiting visible fraction: 60.7927%';
        } else {
          const adaptive = mode === 'adaptive';
          const patch = adaptive ? data.hat[1] : data[mode][index];
          const event = adaptive ? data.events[index] : null;
          const violated = new Set(event ? event.violatedClauses : []);
          const {x, y} = fit(patch.tiles.map(t => t.polygon), width, height);
          element('title', {id: 'pattern-svg-title'}, svg, adaptive ? 'Clause weights on a patch of twenty-five hats' : (mode === 'hat' ? 'Hat substitution patch' : 'Pinwheel substitution patch'));
          element('desc', {id: 'pattern-svg-desc'}, svg, adaptive ? 'The first seventeen tiles represent clauses. Stronger fill means higher positive clause weight. Outlined tiles are clauses violated by the current Boolean assignment.' : 'A valid substitution patch. Colors indicate orientation sectors or reflected versus unreflected copies.');
          patch.tiles.forEach((tile, j) => {
            const angle = (Math.round(tile.orientationDegrees * 1e6) / 1e6 + 360) % 360;
            const sector = Math.min(5, Math.floor(angle / 60));
            let fill, opacity = 0.3, stroke = 'var(--border)', strokeWidth = 0.85;
            if (adaptive) {
              const assigned = j < event.weights.length;
              fill = assigned ? 'var(--viz-series-1)' : 'var(--muted-foreground)';
              opacity = assigned ? 0.13 + 0.7 * (event.weights[j] - 1) / Math.max(1, eventMaxWeight - 1) : 0.06;
              if (violated.has(j)) { stroke = 'var(--viz-series-2)'; strokeWidth = 2.5; }
            } else fill = color.value === 'orientation' ? 'var(--viz-series-' + (sector + 1) + ')' : 'var(--viz-series-' + (tile.reflected ? 2 : 1) + ')';
            const points = tile.polygon.map(p => x(p[0]) + ',' + y(p[1])).join(' ');
            const label = adaptive && j < event.weights.length ? 'Clause ' + (j + 1) + ', weight ' + event.weights[j].toFixed(3) + (violated.has(j) ? ', violated' : ', satisfied') : 'Orientation ' + angle.toFixed(2) + ' degrees, ' + (tile.reflected ? 'reflected' : 'unreflected');
            element('polygon', {points, fill, 'fill-opacity': opacity, stroke, 'stroke-width': strokeWidth, 'stroke-linejoin': 'round', 'data-tile': '', 'data-tooltip': label}, svg);
          });
          if (adaptive) {
            levelLabel.textContent = 'Search event'; levelValue.textContent = index + ' / ' + (data.events.length - 1);
            status.textContent = 'Assignment ' + labelBits(event.state) + ' · ' + event.violatedClauses.length + ' violated clauses · ' + event.kind;
            legendItem('Higher fill: larger clause weight', 'var(--viz-series-1)'); legendItem('Outline: violated clause', 'var(--viz-series-2)');
            detail.textContent = event.updateCount + ' weight updates · ' + event.flipCount + ' bit flips · current energy ' + event.energy.toFixed(3);
          } else {
            levelLabel.textContent = 'Refinement'; levelValue.textContent = index;
            const reflections = patch.tiles.filter(t => t.reflected).length;
            const orientations = new Set(patch.tiles.map(t => ((Math.round(t.orientationDegrees * 1e6) / 1e6 + 360) % 360).toFixed(6))).size;
            status.textContent = patch.tiles.length + (mode === 'hat' ? ' hats' : ' triangles') + ' · ' + reflections + ' reflected · ' + orientations + ' orientations';
            if (color.value === 'orientation') for (let i = 0; i < 6; i++) legendItem((60 * i) + '–' + (60 * (i + 1)) + '°', 'var(--viz-series-' + (i + 1) + ')');
            else { legendItem('Unreflected', 'var(--viz-series-1)'); legendItem('Reflected', 'var(--viz-series-2)'); }
            detail.textContent = mode === 'hat' ? 'Authors’ H-metatile substitution' : 'Five smaller triangles per parent';
          }
        }
        figure.replaceChildren(svg);
      }
      function changeView() {
        const mode = view.value;
        level.max = mode === 'adaptive' ? data.events.length - 1 : mode === 'lattice' ? 3 : data[mode].length - 1;
        level.value = mode === 'adaptive' ? 0 : mode === 'pinwheel' ? 2 : 1;
        update();
      }
      view.addEventListener('change', changeView);
      level.addEventListener('input', update);
      color.addEventListener('change', update);
      new ResizeObserver(update).observe(figure);
      update();
    })();
  </script>
</div>
</main><script>
(() => {
  const tip = document.createElement('div');
  tip.className = 'export-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  let active = null;
  function show(target, x, y) {
    const mark = target instanceof Element ? target.closest('[data-tooltip]') : null;
    if (!mark) { tip.hidden = true; active = null; return; }
    active = mark; tip.textContent = mark.getAttribute('data-tooltip'); tip.hidden = false;
    const bounds = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 12, window.innerWidth - bounds.width - 8)) + 'px';
    tip.style.top = Math.max(8, Math.min(y + 12, window.innerHeight - bounds.height - 8)) + 'px';
  }
  document.addEventListener('pointermove', event => show(event.target, event.clientX, event.clientY));
  document.addEventListener('pointerdown', event => {
    const mark = event.target instanceof Element ? event.target.closest('[data-tooltip]') : null;
    if (active === mark && !tip.hidden) { tip.hidden = true; active = null; }
    else show(event.target, event.clientX, event.clientY);
  });
  document.addEventListener('focusin', event => { const b = event.target.getBoundingClientRect(); show(event.target, b.left, b.bottom); });
  document.addEventListener('focusout', () => { tip.hidden = true; active = null; });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { tip.hidden = true; active = null; } });
})();
</script></body>
