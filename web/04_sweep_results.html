  <script>
    (() => {
      const root = document.getElementById('jewel-sweep-results');
      const data = JSON.parse(root.querySelector('#sweep-data').textContent);
      if (data.pending) return;
      const view = root.querySelector('#sweep-view'), transform = root.querySelector('#sweep-transform');
      const family = root.querySelector('#sweep-family'), constant = root.querySelector('#sweep-constant');
      const tiling = root.querySelector('#sweep-tiling'), eventInput = root.querySelector('#sweep-event');
      const matrix = root.querySelector('#sweep-matrix'), graph = root.querySelector('#sweep-graph');
      const detail = root.querySelector('#sweep-detail'), baselines = root.querySelector('#sweep-baselines');
      const caption = root.querySelector('#sweep-caption');
      const ns = 'http://www.w3.org/2000/svg';
      let selected = {constant: data.constants[0].id, tiling: 'hat'};
      data.constants.forEach(c => { const option = document.createElement('option'); option.value = c.id; option.textContent = c.label; constant.appendChild(option); });
      constant.value = data.constants[0].id;
      function html(tag, parent, text) { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; parent.appendChild(node); return node; }
      function svgNode(tag, attrs, parent, text) { const node = document.createElementNS(ns, tag); Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v)); if (text !== undefined) node.textContent = text; parent.appendChild(node); return node; }
      function showResults() {
        const stats = data.frames[family.value][transform.value];
        const table = document.createElement('table'); table.className = 'table table-sm sweep-table';
        const head = html('thead', table), row = html('tr', head); html('th', row, 'Value');
        ['Hat', 'Pinwheel', 'Square'].forEach(name => html('th', row, name));
        const body = html('tbody', table);
        data.constants.forEach(c => {
          const tr = html('tr', body); const th = html('th', tr, c.label); th.setAttribute('scope', 'row');
          ['hat', 'pinwheel', 'square'].forEach(t => {
            const record = stats[c.id][t], td = html('td', tr);
            const rate = record.total ? record.ok / record.total : 0;
            const button = html('button', td, record.total ? Math.round(100 * rate) + '%' : '—');
            button.type = 'button'; button.className = 'btn viz-tile';
            button.style.background = 'color-mix(in srgb, var(--viz-series-1) ' + Math.round(7 + 48 * rate) + '%, transparent)';
            button.setAttribute('aria-label', c.label + ', ' + t + ': ' + record.ok + ' of ' + record.total + ' held-out SAT starts solved');
            button.addEventListener('click', () => { selected = {constant: c.id, tiling: t}; updateDetail(); });
          });
        });
        matrix.replaceChildren(table);
        function updateDetail() {
          const c = data.constants.find(c => c.id === selected.constant), r = stats[selected.constant][selected.tiling];
          detail.textContent = c.label + ' · ' + selected.tiling + ' · ' + r.ok + ' / ' + r.total + ' held-out SAT starts solved';
        }
        updateDetail();
        const controls = data.controls[family.value];
        baselines.textContent = 'Same cases: Breakout ' + controls.breakout.ok + '/' + controls.breakout.total + ' · WalkSAT ' + controls.walksat.ok + '/' + controls.walksat.total + ' · greedy + restarts ' + controls.restarts.ok + '/' + controls.restarts.total;
        caption.textContent = 'Cell fill and value: solved fraction · 12–32 variables · confirmed SAT cases only';
      }
      function showTrap() {
        const trap = data.traps[constant.value][tiling.value];
        eventInput.max = trap.events.length - 1;
        if (Number(eventInput.value) > Number(eventInput.max)) eventInput.value = '0';
        const eventIndex = Number(eventInput.value), event = trap.events[eventIndex];
        root.querySelector('#sweep-event-value').textContent = eventIndex + ' / ' + (trap.events.length - 1);
        const width = Math.max(280, graph.getBoundingClientRect().width), height = 340;
        const scale = Math.min((width - 72) / 1.5, (height - 86) / 1.5);
        const x = value => width / 2 + (value - .75) * scale;
        const y = value => height / 2 - (value - .75) * scale;
        const vertices = Array.from({length: 8}, (_, id) => ({id, x: (id & 1) + .5 * ((id >> 2) & 1), y: ((id >> 1) & 1) + .5 * ((id >> 2) & 1), label: Array.from({length: 3}, (_, bit) => (id >> bit) & 1).join('')}));
        const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height); svg.setAttribute('height', height); svg.setAttribute('role', 'img'); svg.setAttribute('aria-labelledby', 'sweep-trap-title sweep-trap-desc');
        svgNode('title', {id: 'sweep-trap-title'}, svg, 'A seven-clause formula where fixed-weight strict descent stalls');
        svgNode('desc', {id: 'sweep-trap-desc'}, svg, 'Each node is an assignment. The only satisfying node is 111. At event zero, 000 is no more expensive than any one-bit neighbor. Later events raise violated-clause weights and show an ordinary Breakout escape.');
        vertices.forEach(p => [1, 2, 4].forEach(mask => { if (p.id < (p.id ^ mask)) { const q = vertices[p.id ^ mask]; svgNode('line', {x1: x(p.x), y1: y(p.y), x2: x(q.x), y2: y(q.y), stroke: 'var(--border)', 'stroke-width': 1.5}, svg); } }));
        const path = trap.events.slice(0, eventIndex + 1).filter(e => e.kind !== 'boost').map(e => vertices[e.state]);
        if (path.length > 1) svgNode('polyline', {points: path.map(p => x(p.x) + ',' + y(p.y)).join(' '), fill: 'none', stroke: 'var(--viz-series-1)', 'stroke-width': 3, 'data-escape-path': ''}, svg);
        vertices.forEach(p => {
          const px = x(p.x), py = y(p.y);
          if (p.id === 7) svgNode('path', {d: 'M ' + px + ' ' + (py - 23) + ' L ' + (px + 23) + ' ' + py + ' L ' + px + ' ' + (py + 23) + ' L ' + (px - 23) + ' ' + py + ' Z', fill: 'color-mix(in srgb, var(--viz-series-2) 20%, var(--background))', stroke: 'var(--border)'}, svg);
          else svgNode('circle', {cx: px, cy: py, r: 20, fill: 'var(--background)', stroke: 'var(--border)'}, svg);
          if (p.id === event.state) svgNode('circle', {cx: px, cy: py, r: 26, fill: 'none', stroke: 'var(--viz-series-1)', 'stroke-width': 2, 'data-active-state': p.id}, svg);
          svgNode('text', {x: px, y: py + 4, 'text-anchor': 'middle'}, svg, p.label);
          svgNode('text', {x: px, y: py + 37, 'text-anchor': 'middle', 'data-energy': p.id}, svg, event.energy[p.id].toFixed(2));
        });
        graph.replaceChildren(svg);
        detail.textContent = 'State ' + vertices[event.state].label + ' · ' + event.updates + ' weight boosts · ' + (event.state === 7 ? 'solution found' : event.kind === 'boost' ? 'weights changed' : 'search state');
        baselines.textContent = 'Circle: assignment · diamond: unique solution · number below: current weighted energy';
        caption.textContent = 'Initial state: 000 · Unique satisfying state: 111';
      }
      function update() {
        const trap = view.value === 'trap'; matrix.hidden = trap; graph.hidden = !trap;
        for (const id of ['transform', 'family']) root.querySelector('#sweep-' + id + '-label').hidden = trap;
        for (const id of ['constant', 'tiling', 'event']) root.querySelector('#sweep-' + id + '-label').hidden = !trap;
        if (trap) showTrap(); else showResults();
      }
      view.addEventListener('change', update); transform.addEventListener('change', update); family.addEventListener('change', update);
      for (const input of [constant, tiling]) input.addEventListener('change', () => { eventInput.value = '0'; update(); });
      eventInput.addEventListener('input', update);
      new ResizeObserver(() => { if (view.value === 'trap') showTrap(); }).observe(graph);
      update();
    })();
  </script>

(() => {
  const tip = document.createElement('div');
  tip.className = 'export-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  let active = null;
  function show(target, x, y) {
    const mark = target instanceof Element ? target.closest('[data-tooltip]') : null;
    if (!mark) { tip.hidden = true; active = null; return; }
    active = mark; tip.textContent = mark.getAttribute('data-tooltip'); tip.hidden = false;
    const bounds = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 12, window.innerWidth - bounds.width - 8)) + 'px';
    tip.style.top = Math.max(8, Math.min(y + 12, window.innerHeight - bounds.height - 8)) + 'px';
  }
  document.addEventListener('pointermove', event => show(event.target, event.clientX, event.clientY));
  document.addEventListener('pointerdown', event => {
    const mark = event.target instanceof Element ? event.target.closest('[data-tooltip]') : null;
    if (active === mark && !tip.hidden) { tip.hidden = true; active = null; }
    else show(event.target, event.clientX, event.clientY);
  });
  document.addEventListener('focusin', event => { const b = event.target.getBoundingClientRect(); show(event.target, b.left, b.bottom); });
  document.addEventListener('focusout', () => { tip.hidden = true; active = null; });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { tip.hidden = true; active = null; } });
})();
