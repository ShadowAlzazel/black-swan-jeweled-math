          for(let row=-rows;row<=rows;row++)for(let column=-columns;column<=columns;column++) {

          const minY=Math.min(...points.map(p=>p[1])),maxY=Math.max(...points.map(p=>p[1]));

      function area(poly) { return poly.reduce((sum,a,j)=>{const b=poly[(j+1)%poly.length];return sum+a[0]*b[1]-a[1]*b[0];},0)/2; }

      function build() {
        const k=constants[constant.value],L=Math.log(k),tau=Number(shear.value),kind=mapChoice.value;
        const cells=polygons(pattern.value,L).map((poly,id)=> {
          const sample=centroid(poly),z0=[sample[0],sample[1]+tau*sample[0]],zin=[];
          poly.forEach((a,j)=>{const b=poly[(j+1)%poly.length];for(let step=0;step<48;step++){const t=step/48,u=a[0]+t*(b[0]-a[0]),v=a[1]+t*(b[1]-a[1]);zin.push([u,v+tau*u]);}});

        function pathFor(cell) { const points=which==='input'?cell.zin:cell.wout;return points.map((p,j)=>(j?'L':'M')+x(p[0]).toFixed(3)+','+y(p[1]).toFixed(3)).join(' ')+' Z'; }

        svgEl('circle',{cx:x(sample[0]),cy:y(sample[1]),r:4,fill:'var(--foreground)','pointer-events':'none'},svg);
        for(const f of [0,.5,1]) {
          const tx=minX+f*(maxX-minX),ty=minY+f*(maxY-minY);

          svgEl('text',{x:frame.left-8,y:y(ty)+4,'text-anchor':'end'},svg,ty.toFixed(1));
        }
        svgEl('text',{x:(frame.left+frame.right)/2,y:height-5,'text-anchor':'middle',class:'axis-title','data-axis':'x'},svg,which==='input'?'Re(z)':'Re(w)');
        const cy=(frame.top+frame.bottom)/2;
        svgEl('text',{x:16,y:cy,transform:'rotate(-90 16 '+cy+')','text-anchor':'middle',class:'axis-title','data-axis':'y'},svg,which==='input'?'Im(z)':'Im(w)');
        container.replaceChildren(svg);
      }
      function render() {

  </script>
</div>
</main><script>
(() => {
  const tip = document.createElement('div');
  tip.className = 'export-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  let active = null;
  function show(target, x, y) {
    const mark = target instanceof Element ? target.closest('[data-tooltip]') : null;
    if (!mark) { tip.hidden = true; active = null; return; }
    active = mark; tip.textContent = mark.getAttribute('data-tooltip'); tip.hidden = false;
    const bounds = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 12, window.innerWidth - bounds.width - 8)) + 'px';
    tip.style.top = Math.max(8, Math.min(y + 12, window.innerHeight - bounds.height - 8)) + 'px';
  }
  document.addEventListener('pointermove', event => show(event.target, event.clientX, event.clientY));
  document.addEventListener('pointerdown', event => {
    const mark = event.target instanceof Element ? event.target.closest('[data-tooltip]') : null;
    if (active === mark && !tip.hidden) { tip.hidden = true; active = null; }
    else show(event.target, event.clientX, event.clientY);
  });
  document.addEventListener('focusin', event => { const b = event.target.getBoundingClientRect(); show(event.target, b.left, b.bottom); });
  document.addEventListener('focusout', () => { tip.hidden = true; active = null; });
